model:
  vocab_size: 50257
  context_length: 1024
  emb_dim: 768
  n_heads: 12
  n_layers: 12
  drop_rate: 0.1
  qkv_bias: True
  
training:
  batch_size: 2
  num_epochs: 10
  lr: 0.0004
  weight_decay: 0.1
  eval_freq: 5
  eval_iter: 5
  seed: 123
  
generation:
  max_new_tokens: 25
  top_k: 50
  temperature: 0
data:
  file_path : "the-verdict.txt"
  url : "https://raw.githubusercontent.com/rasbt/LLMs-from-scratch/main/ch02/01_main-chapter-code/the-verdict.txt"
  train_ratio: 0.9
